[project]
name = "predx"
version = "0.1.0"
description = "510(k) predicate-retrieval data extraction, audit and conceptual tests (COMS 4705 project)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
